name: Roblox Price Alerts

on:
  schedule:
    # Every five minutes, offset to avoid the busiest minute at the top of the hour.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Also send a clearly labeled simulated test embed'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: roblox-price-alerts
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Load the latest code and saved alert state
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check prices and send qualifying embeds
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          PING_EVERYONE: 'true'
          TEST_ALERT: ${{ github.event.inputs.test_alert || 'false' }}
          PRICE_ALERT_STATE_FILE: state.json
        run: |
          python -u - <<'PY'
          import time
          import price_alert

          window_end = time.monotonic() + 300
          print("Checking about once per minute during this job.", flush=True)
          while time.monotonic() < window_end:
              check_started = time.monotonic()
              backoff = price_alert.main() or 0
              price_alert.TEST_ALERT = False
              price_alert.MANUAL_RUN = False
              next_check = max(check_started + 60, time.monotonic() + backoff)
              if next_check >= window_end:
                  break
              time.sleep(max(0, next_check - time.monotonic()))
          PY

      - name: Save alert state so the next run does not repeat the same alert
        if: ${{ always() }}
        env:
          PRICE_ALERT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -f state.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Save price alert state [skip ci]"
          git pull --rebase origin "$PRICE_ALERT_BRANCH"
          git push origin "HEAD:$PRICE_ALERT_BRANCH"
